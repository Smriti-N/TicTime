<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicTime · Tic-Tac-Toe</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#7c3aed" />
  <meta name="description" content="Two players. Nine squares. One clock ticking." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TicTime" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- shared colour gradients used by the X and O marks -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="grad-x" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset="1" stop-color="#ffc371"/></linearGradient>
      <linearGradient id="grad-o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36d1dc"/><stop offset="1" stop-color="#5b86e5"/></linearGradient>
    </defs>
  </svg>
  <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>

  <header class="header">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="18" fill="url(#grad-o)"/>
        <path d="M24 12v40M40 12v40M12 24h40M12 40h40" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
        <path d="M15 15l6 6M21 15l-6 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="47" cy="47" r="4.5" fill="none" stroke="#fff" stroke-width="3.5"/>
      </svg>
      <div>
        <h1>TicTime</h1>
        <p class="tagline">Two players. Nine squares. One clock ticking.</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="install-btn" class="btn btn-install" aria-label="Install app">📲 Install App</button>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel game">
      <div class="scoreboard" role="region" aria-label="Scoreboard">
        <div class="score-card x"><span class="score-label">Player X</span><span class="score-value" id="score-x">0</span></div>
        <div class="score-card"><span class="score-label">Draws</span><span class="score-value" id="score-draws">0</span></div>
        <div class="score-card o"><span class="score-label">Player O</span><span class="score-value" id="score-o">0</span></div>
      </div>

      <div class="status" id="status" aria-live="polite" aria-atomic="true">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Player X's turn</span>
      </div>

      <!-- Dedicated screen reader live region for instant move & result announcements -->
      <div id="sr-announcements" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

      <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe Board" data-turn="X"></div>

      <div class="controls">
        <button id="new-game-btn" class="btn btn-primary">New Game</button>
        <button id="reset-scores-btn" class="btn btn-ghost">Reset Scores</button>
      </div>

      <div class="options">
        <label class="option">Mode
          <select id="mode-select" disabled><option>Two players</option><option>vs Computer</option></select>
          <span class="badge">Coming soon</span>
        </label>
        <label class="option">Board
          <select id="size-select" disabled><option>3 × 3</option><option>4 × 4</option><option>5 × 5</option></select>
          <span class="badge">Coming soon</span>
        </label>
      </div>
    </section>

    <aside class="panel history">
      <h2>Move history</h2>
      <p class="muted">Coming soon. Every move will be listed here so you can jump back in time.</p>
    </aside>
  </main>

  <footer class="footer"><!-- TODO: add a footer (credits, GitHub link, year) --></footer>

  <!-- Offline status indicator -->
  <div id="offline-toast" class="offline-toast" hidden>⚡ You are offline · Offline play ready</div>

  <!-- Install Guide Modal -->
  <div id="install-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <button id="modal-close-btn" class="modal-close" aria-label="Close modal">&times;</button>
      <div class="modal-header">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true" style="width:44px;height:44px">
          <rect width="64" height="64" rx="18" fill="url(#grad-o)"/>
          <path d="M24 12v40M40 12v40M12 24h40M12 40h40" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
          <path d="M15 15l6 6M21 15l-6 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="47" cy="47" r="4.5" fill="none" stroke="#fff" stroke-width="3.5"/>
        </svg>
        <h3 class="modal-title">Install TicTime</h3>
      </div>
      <div id="install-guide-content" class="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-ok-btn" class="btn btn-primary" style="width:100%">Got it!</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
